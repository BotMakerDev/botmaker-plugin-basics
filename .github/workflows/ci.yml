name: CI

# Three jobs, the same shape as every other published BotMaker module: `build` on every push and PR,
# `release` and `jitpack` only on a version tag.
#
# TWO UPSTREAMS ARE RESOLVED FROM SOURCE rather than from JitPack, and that follows from this pom: it pins
# ${botmaker.studioapi.version} and ${botmaker.plugintoolkit.version} at 0.0.0-SNAPSHOT — the version the
# umbrella reactor and a local `mvn install` produce — so there is no published artifact under those
# coordinates to download. release.sh's check_ci_deps refuses a release whose ci.yml does not check out
# every 0.0.0-SNAPSHOT upstream it declares, which is what keeps this list in step with the pom.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin contract this module implements. `provided` scope, so it is on nobody's runtime
      # classpath — but the build needs it present.
      - name: Check out botmaker-studio-api
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      # The widget kit, at `compile` scope: this plugin ships with it on its own classloader.
      - name: Check out botmaker-plugin-toolkit
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-plugin-toolkit
          path: .deps/botmaker-plugin-toolkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RETRIED — Maven Central answers 429 to GitHub-hosted runners; see .github/mvn-retry.sh.
      # The contract goes in first: the toolkit's own build resolves it.
      - name: Install the upstreams (0.0.0-SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-toolkit/pom.xml install -DskipTests

      - name: Build and test
        run: mvn -B verify

  # The GitHub Release, published by JReleaser from the tag the umbrella's release.sh pushed. It runs HERE
  # and not from the umbrella working copy for a measured reason, recorded in jreleaser.yml: in a submodule
  # checkout `.git` is a FILE and JReleaser's JGit reports "repository not found". The tag itself stays
  # release.sh's, because tag ORDER across the eleven repositories is the one thing JReleaser cannot
  # express.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else. Strict here — no --allow-unreleased — because by the
      # time this runs release.sh has stamped the version onto the heading, and a fallback could only fire
      # if that stamp had failed.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly so the first
  # consumer — the SDK, or a project resolving this plugin — doesn't wait. No secrets required.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
