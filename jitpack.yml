jdk:
  - openjdk25
install:
  # The committed pom pins botmaker.studioapi.version and botmaker.plugintoolkit.version to
  # 0.0.0-SNAPSHOT (the reactor/dev value). JitPack cannot resolve a SNAPSHOT, so the tags are injected via
  # -D at build time and the committed pom is never edited. They come from .deps.env, written by the
  # umbrella release.sh in this release's own commit, so they are the upstream releases this tag was
  # actually cut against rather than whatever `git ls-remote --tags | tail -1` happens to return.
  #
  # REQUIRED rather than defaulted: pom.xml runs flatten-maven-plugin, so whatever is injected here is
  # BAKED INTO the published pom. A stale default would point every consumer of a hand-cut tag at a
  # long-dead contract, and this module has consumers that are other plugins. Failing the build with a
  # readable message is strictly better than publishing that — botmaker-plugin-toolkit, botmaker-plugin-host
  # and botmaker-cli each burned a tag on a MISSING .deps.env on 2026-09-02.
  - . ./.deps.env
  - '[ -n "${STUDIO_API_TAG:-}" ] || { echo "ERROR: .deps.env must pin STUDIO_API_TAG. Cut releases with the umbrella release.sh, which writes it into the release commit." >&2; exit 1; }'
  - '[ -n "${PLUGIN_TOOLKIT_TAG:-}" ] || { echo "ERROR: .deps.env must pin PLUGIN_TOOLKIT_TAG. Cut releases with the umbrella release.sh, which writes it into the release commit." >&2; exit 1; }'
  - mvn install -DskipTests -Dmaven.javadoc.skip=true -B -Dbotmaker.studioapi.version=$STUDIO_API_TAG -Dbotmaker.plugintoolkit.version=$PLUGIN_TOOLKIT_TAG
