# JReleaser — what ONE release of this repository looks like.
#
# The split with the umbrella's release.sh is the whole design:
#
#   * release.sh knows the CONSTELLATION — which of the eleven repositories changed, what each one's next
#     version is, the order the tags go out in, and which upstream ref each downstream pins. Nothing in
#     JReleaser can express that: its unit of work is one repository, one version, one release.
#   * this file knows what a release IS — the tag, the GitHub Release, and the notes on it.
#
# WHERE THIS RUNS: this repository's own CI, on a version tag, and nowhere else —
# .github/workflows/ci.yml, the `release` job. NOT from the umbrella working copy, and that is measured
# rather than preferred (2026-08-28): in a submodule checkout `.git` is a FILE (`gitdir: ../.git/modules/
# <mod>`) and JReleaser's JGit reports "repository not found", while `--git-root-search` gets past it only
# by resolving the UMBRELLA repository — which would attach this release to the wrong repo.
# jreleaser-maven-plugin is not used either: it ignores this file entirely and takes the version from
# <version>, which here is the cosmetic 0.0.0-SNAPSHOT JitPack overrides.
#
# THE VERSION ARRIVES AS JRELEASER_PROJECT_VERSION, set by the workflow from the tag that triggered it.
#
# NOTHING HERE TOUCHES AN ORDINARY BUILD: no Maven plugin, no lifecycle binding, nothing to download.

project:
  name: botmaker-plugin-basics
  description: The value types, the Settings and the project store a BotMaker project is made of.
  longDescription: |
    Plugin #2. It owns the nine JDK value types every project's parameters are made of, the Settings a
    running bot reads them through, and the one project store both are written into — an API other plugins
    depend on as an ordinary Maven dependency, the SDK included. Resolved onto the PLUGIN classloader of
    the project that wants it, never onto the host's.
  authors:
    - LiQiyeDev
  license: CC0-1.0
  copyright: LiQiyeDev
  inceptionYear: '2026'
  links:
    homepage: https://github.com/LiQiyeDev/botmaker-plugin-basics
  languages:
    java:
      groupId: com.github.LiQiyeDev
      artifactId: botmaker-plugin-basics
      version: '21'

release:
  github:
    owner: LiQiyeDev
    name: botmaker-plugin-basics
    tagName: 'v{{projectVersion}}'
    releaseName: 'v{{projectVersion}}'
    # release.sh created and pushed the tag, and that push is what started the workflow running this — so
    # there is nothing left to tag. The tag is what orders a cross-module release and triggers every
    # downstream CI job, and that ordering is the one thing JReleaser has no way to express.
    skipTag: true
    # A pushed tag cannot be edited and a published release should not be silently replaced.
    overwrite: false
    update:
      enabled: false
    # The CHANGELOG.md section for exactly this version, written by the workflow's extract step through
    # tools/changelog-section.sh — the SAME script release.sh calls to gate the release. `external` is taken
    # verbatim, so the changelog stays written by a person.
    changelog:
      external: target/jreleaser-changelog.md
